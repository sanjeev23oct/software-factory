# The preview server for the factory's client projects. setup.sh writes .env and
# sites/ next to this file and starts it with `docker compose up -d`, adding
# compose.host.yml when previews have a hostname, or compose.port.yml when they
# are served on a port.
services:
  factory-preview:
    image: nginx:1.27-alpine
    container_name: factory-preview
    restart: unless-stopped
    environment:
      STATUS_REPO: ${STATUS_REPO:-}
      STATUS_TOKEN: ${STATUS_TOKEN:-}
    volumes:
      - ./sync.sh:/docker-entrypoint.d/90-preview-sync.sh:ro
      - ./sites:/etc/factory-sites:ro
    networks:
      - gitlab

networks:
  gitlab:
    external: true
    name: ${GITLAB_NETWORK}
